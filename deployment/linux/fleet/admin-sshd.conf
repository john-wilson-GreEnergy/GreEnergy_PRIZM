# Dedicated SS3-only management after cutover. No Include of broad host config.
# Install ONLY the approved management public key in this root-managed file.
Port 22
ListenAddress 10.0.0.15
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/prizm-fleet-admin/sshd.pid
AuthorizedKeysFile /etc/prizm-fleet/admin/authorized_keys
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ebc
UsePAM yes
PermitTTY yes
PermitUserEnvironment no
DisableForwarding yes
X11Forwarding no
PermitTunnel no
GatewayPorts no
MaxAuthTries 3
MaxSessions 3
MaxStartups 3:30:6
LoginGraceTime 30
ClientAliveInterval 60
ClientAliveCountMax 3
LogLevel VERBOSE
Subsystem sftp internal-sftp
